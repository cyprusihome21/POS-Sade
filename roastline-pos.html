<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roastline POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --espresso:#1c1410;
    --espresso-2:#2a1f18;
    --crema:#e9c996;
    --crema-dim:#c7a877;
    --copper:#b5652f;
    --copper-light:#d98a52;
    --paper:#f6ede0;
    --paper-dim:#d9cbb4;
    --ok:#7a9a6c;
    --err:#b5453a;
    --line: rgba(233,201,150,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--espresso);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- generic ---------- */
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:11px 18px;
    border-radius:7px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--copper); color:var(--espresso);}
  .btn-primary:hover{background:var(--copper-light);}
  .btn-outline{background:transparent; color:var(--crema); border-color:var(--line);}
  .btn-outline:hover{border-color:var(--crema-dim);}
  .btn-danger{background:transparent; color:var(--err); border-color:rgba(181,69,58,0.4);}
  .btn-danger:hover{background:rgba(181,69,58,0.12);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  input,select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:var(--espresso-2);
    border:1px solid var(--line);
    color:var(--paper);
    padding:10px 12px;
    border-radius:7px;
    width:100%;
    outline:none;
  }
  input:focus,select:focus{border-color:var(--copper-light);}
  label{font-size:12px; color:var(--crema-dim); display:block; margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .card{
    background:var(--espresso-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
  }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:600; letter-spacing:.02em;
    padding:4px 10px; border-radius:20px;
    border:1px solid var(--line); color:var(--crema-dim);
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--crema-dim);}
  .dot.live{background:var(--ok); box-shadow:0 0 0 0 rgba(122,154,108,.6); animation:pulse 2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(122,154,108,.55);}
    70%{box-shadow:0 0 0 6px rgba(122,154,108,0);}
    100%{box-shadow:0 0 0 0 rgba(122,154,108,0);}
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--espresso-2); border:1px solid var(--line); color:var(--paper);
    padding:11px 18px; border-radius:8px; font-size:13px; z-index:999;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.err{border-color:rgba(181,69,58,.5); color:#f0b8b2;}
  .toast.ok{border-color:rgba(122,154,108,.5); color:#cfe3c6;}
  a.link{color:var(--copper-light); cursor:pointer; text-decoration:none; font-size:13px;}
  a.link:hover{text-decoration:underline;}
  .hr{border:none; border-top:1px dashed var(--paper-dim); opacity:.25; margin:14px 0;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--espresso-2); border-radius:6px;}

  /* ---------- centered screens (connect / login / setup) ---------- */
  .center-screen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 15% 10%, rgba(181,101,47,0.14), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(233,201,150,0.08), transparent 45%);
  }
  .panel{width:100%; max-width:380px;}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:26px;}
  .brand .mark{
    width:38px;height:38px;border-radius:9px;background:var(--copper);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;
    font-weight:700; color:var(--espresso); font-size:18px;
  }
  .brand .name{font-size:19px;}
  .brand .sub{font-size:11px; color:var(--crema-dim); letter-spacing:.03em;}

  /* ---------- shell (logged-in layout) ---------- */
  .shell{flex:1; display:flex; flex-direction:column; min-height:100vh;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:var(--espresso-2);
  }
  .topbar .left{display:flex; align-items:center; gap:14px;}
  .topbar .who{font-size:13px; color:var(--crema-dim);}
  .topbar .who b{color:var(--paper);}
  .topbar .actions{display:flex; align-items:center; gap:10px;}
  .role-tag{
    font-size:10px; font-weight:700; letter-spacing:.06em; padding:3px 9px; border-radius:5px;
    background:var(--copper); color:var(--espresso);
  }
  .main{flex:1; padding:22px; max-width:1200px; width:100%; margin:0 auto;}

  /* ---------- POS (cashier) ---------- */
  .pos-layout{display:grid; grid-template-columns:1fr 340px; gap:18px;}
  @media(max-width:860px){.pos-layout{grid-template-columns:1fr;}}
  .product-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;
  }
  .product-btn{
    aspect-ratio:1/0.85; border-radius:10px; border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    cursor:pointer; padding:10px; text-align:center; background:var(--espresso-2);
    transition:transform .08s ease, border-color .15s ease;
  }
  .product-btn:active{transform:scale(0.95);}
  .product-btn .emoji{font-size:26px;}
  .product-btn .pname{font-size:12.5px; font-weight:600; line-height:1.25;}
  .product-btn .pprice{font-size:11px; color:var(--crema-dim);}
  .cart-panel{
    background:var(--espresso-2); border:1px solid var(--line); border-radius:10px;
    display:flex; flex-direction:column; max-height:calc(100vh - 130px); position:sticky; top:18px;
  }
  .cart-head{padding:14px 16px; border-bottom:1px dashed var(--paper-dim); opacity:1;}
  .cart-head h3{opacity:1;}
  .cart-items{flex:1; overflow-y:auto; padding:8px 16px;}
  .cart-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line);}
  .cart-row:last-child{border-bottom:none;}
  .cart-row .ci-name{font-size:13.5px; font-weight:500;}
  .cart-row .ci-meta{font-size:11px; color:var(--crema-dim);}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{
    width:22px;height:22px; border-radius:5px; border:1px solid var(--line); background:transparent;
    color:var(--paper); cursor:pointer; font-size:13px; line-height:1;
  }
  .cart-foot{padding:14px 16px; border-top:1px solid var(--line);}
  .total-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .total-row .amt{font-family:'Fraunces',serif; font-size:26px; font-weight:600;}
  .pay-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .pay-toggle button{flex:1; padding:9px; border-radius:7px; border:1px solid var(--line); background:transparent; color:var(--crema-dim); cursor:pointer; font-size:13px; font-weight:600;}
  .pay-toggle button.active{background:var(--copper); color:var(--espresso); border-color:var(--copper);}
  .empty-cart{padding:30px 10px; text-align:center; color:var(--crema-dim); font-size:13px;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--crema-dim); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:9px 10px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
  .stat{background:var(--espresso-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .stat .label{font-size:11px; color:var(--crema-dim); margin-bottom:6px;}
  .stat .value{font-family:'Fraunces',serif; font-size:24px; font-weight:600;}

  .tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--line);}
  .tab{padding:10px 16px; font-size:13px; font-weight:600; color:var(--crema-dim); cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--paper); border-bottom-color:var(--copper);}

  .swatch-row{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;}
  .swatch.sel{border-color:var(--paper);}

  /* modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:500; padding:20px;}
  .modal{background:var(--espresso-2); border:1px solid var(--line); border-radius:12px; padding:22px; max-width:440px; width:100%; max-height:85vh; overflow-y:auto;}
  .modal h3{margin-bottom:16px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}

  .receipt{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; background:var(--paper); color:var(--espresso);
    border-radius:6px; padding:18px; line-height:1.6;
  }
  .receipt .rline{display:flex; justify-content:space-between;}
  .receipt hr{border:none; border-top:1px dashed var(--espresso); opacity:.35; margin:8px 0;}

  .empty-state{padding:50px 20px; text-align:center; color:var(--crema-dim);}
  .empty-state .big{font-size:38px; margin-bottom:10px;}

  .banner{padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; border:1px solid;}
  .banner.warn{background:rgba(217,138,82,.08); border-color:rgba(217,138,82,.35); color:var(--copper-light);}
  .banner.err{background:rgba(181,69,58,.08); border-color:rgba(181,69,58,.35); color:#e5978d;}

  code{background:var(--espresso); padding:1px 6px; border-radius:4px; font-size:12px;}
  .setup-steps li{margin-bottom:10px; font-size:13px; color:var(--paper-dim); line-height:1.5;}

  /* ---------- coupon row ---------- */
  .coupon-row{display:flex; gap:8px; margin-bottom:10px;}
  .coupon-row input{flex:1;}
  .applied-coupon{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(122,154,108,0.1); border:1px solid rgba(122,154,108,.35);
    color:#cfe3c6; padding:7px 10px; border-radius:7px; font-size:12.5px; margin-bottom:10px;
  }
  .applied-coupon a{color:#e5978d; cursor:pointer; font-weight:600;}
  .discount-row{display:flex; justify-content:space-between; font-size:13px; color:var(--ok); margin-bottom:6px;}

  /* ---------- draggable menu buttons (developer reorder) ---------- */
  .product-btn.draggable{cursor:grab;}
  .product-btn.dragging{opacity:0.35;}
  .product-btn.drag-over{border-color:var(--copper-light); box-shadow:0 0 0 2px var(--copper-light) inset;}
  .drag-hint{font-size:11.5px; color:var(--crema-dim); margin-bottom:10px;}

  /* ---------- theme editor ---------- */
  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:16px;}
  .theme-swatch-field{display:flex; align-items:center; gap:10px; background:var(--espresso); border:1px solid var(--line); border-radius:8px; padding:9px 12px;}
  .theme-swatch-field input[type=color]{width:34px; height:34px; padding:0; border:none; border-radius:6px; background:none; cursor:pointer;}
  .theme-swatch-field .tlabel{font-size:12.5px; flex:1;}
  .theme-swatch-field .tval{font-size:11px; color:var(--crema-dim);}

  /* ---------- print ---------- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block; position:absolute; top:0; left:0; width:100%;
      background:#fff; color:#000; padding:0;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   ROASTLINE POS — single-file web POS system backed by Google Drive.
   Roles: developer (build/manage), admin (view-only), cashier (sell).
   ========================================================================= */

/* ---------------- CONFIG ----------------
   Fill these in from your own Google Cloud project (see in-app Setup screen
   for exact steps). Nothing will work until CLIENT_ID is set. */
const CONFIG = {
  CLIENT_ID: "123572472682-v17hrcl71fg8t477rb4s0rk6lf6h4ooj.apps.googleusercontent.com",
  DB_FILENAME: "roastline_pos_db.json",
  SCOPES: "https://www.googleapis.com/auth/drive",
  SYNC_INTERVAL_MS: 20000
};

/* ---------------- STATE ---------------- */
const state = {
  accessToken: null,
  tokenClient: null,
  dbFileId: null,
  db: null,            // the whole "database" object, mirrored to Drive
  currentUser: null,   // {id, username, role, name}
  cart: [],            // [{productId, name, price, qty}]
  payMethod: "cash",
  appliedCoupon: null, // {code, percent}
  view: null,          // current screen
  adminTab: "live",
  devTab: "products",
  syncTimer: null,
  saving: false,
  lastError: null,
  dragProductId: null  // developer drag-reorder
};

const DEFAULT_THEME = {
  bg:"#1c1410", bg2:"#2a1f18", accent:"#b5652f", accentLight:"#d98a52", text:"#f6ede0"
};

const $ = sel => document.querySelector(sel);
const app = () => document.getElementById("app");
const uid = () => crypto.randomUUID();
const nowIso = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);
const money = n => "$" + (Math.round(n*100)/100).toFixed(2);

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function toast(msg, kind){
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " "+kind : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ---------------- DEFAULT DB ---------------- */
function defaultDb(){
  return {
    meta: { appActive: true, businessName: "Roastline Coffee", updatedAt: nowIso(), theme: {...DEFAULT_THEME} },
    users: [],          // seeded async below with hashed password
    products: [
      { id: uid(), name:"Espresso", price:3.00, category:"Coffee", emoji:"☕", color:"#b5652f", active:true, order:0, updatedAt: nowIso() },
      { id: uid(), name:"Latte", price:4.50, category:"Coffee", emoji:"🥛", color:"#c7a877", active:true, order:1, updatedAt: nowIso() },
      { id: uid(), name:"Cappuccino", price:4.25, category:"Coffee", emoji:"☕", color:"#8a5a34", active:true, order:2, updatedAt: nowIso() },
      { id: uid(), name:"Cold Brew", price:4.75, category:"Coffee", emoji:"🧊", color:"#3d3128", active:true, order:3, updatedAt: nowIso() },
      { id: uid(), name:"Croissant", price:3.50, category:"Bakery", emoji:"🥐", color:"#d9a441", active:true, order:4, updatedAt: nowIso() },
      { id: uid(), name:"Muffin", price:3.25, category:"Bakery", emoji:"🧁", color:"#a8763e", active:true, order:5, updatedAt: nowIso() },
    ],
    coupons: [],
    sales: [],
    dayCloses: []
  };
}

/* apply theme colors from db.meta.theme onto the page */
function applyTheme(){
  const t = (state.db && state.db.meta && state.db.meta.theme) ? state.db.meta.theme : DEFAULT_THEME;
  const root = document.documentElement.style;
  root.setProperty("--espresso", t.bg || DEFAULT_THEME.bg);
  root.setProperty("--espresso-2", t.bg2 || DEFAULT_THEME.bg2);
  root.setProperty("--copper", t.accent || DEFAULT_THEME.accent);
  root.setProperty("--copper-light", t.accentLight || DEFAULT_THEME.accentLight);
  root.setProperty("--paper", t.text || DEFAULT_THEME.text);
}

/* print any HTML fragment using a hidden print-only container */
function printHTML(innerHtml){
  let area = document.getElementById("printArea");
  if(!area){
    area = document.createElement("div");
    area.id = "printArea";
    document.body.appendChild(area);
  }
  area.innerHTML = innerHtml;
  window.print();
}

/* ================= GOOGLE DRIVE LAYER ================= */

function gisReady(){
  return new Promise(resolve=>{
    const check = () => (window.google && google.accounts && google.accounts.oauth2) ? resolve() : setTimeout(check,100);
    check();
  });
}

async function connectDrive(){
  await gisReady();
  return new Promise((resolve,reject)=>{
    state.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: CONFIG.SCOPES,
      callback: (resp)=>{
        if(resp.error){ reject(resp); return; }
        state.accessToken = resp.access_token;
        resolve(resp.access_token);
      }
    });
    state.tokenClient.requestAccessToken({prompt: ""});
  });
}

function authHeaders(){
  return { "Authorization": "Bearer " + state.accessToken };
}

async function driveFindDbFile(){
  const q = encodeURIComponent(`name='${CONFIG.DB_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`, {headers: authHeaders()});
  if(!res.ok) throw new Error("Drive list failed: "+res.status);
  const data = await res.json();
  return data.files && data.files.length ? data.files[0] : null;
}

async function driveCreateDbFile(dbObj){
  const boundary = "roastline-boundary";
  const metadata = { name: CONFIG.DB_FILENAME, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dbObj)}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method:"POST",
    headers:{ ...authHeaders(), "Content-Type": `multipart/related; boundary=${boundary}` },
    body
  });
  if(!res.ok) throw new Error("Drive create failed: "+res.status);
  const data = await res.json();
  return data.id;
}

async function driveReadFile(fileId){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers: authHeaders()});
  if(!res.ok) throw new Error("Drive read failed: "+res.status);
  return await res.json();
}

async function driveWriteFile(fileId, dbObj){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method:"PATCH",
    headers:{ ...authHeaders(), "Content-Type":"application/json" },
    body: JSON.stringify(dbObj)
  });
  if(!res.ok) throw new Error("Drive write failed: "+res.status);
}

/* merge remote + local: newer 'updatedAt' wins per-record; sales/dayCloses union by id */
function mergeDb(local, remote){
  if(!remote) return local;
  if(!local) return remote;
  const merged = { meta: null, users: [], products: [], coupons: [], sales: [], dayCloses: [] };
  merged.meta = (new Date(remote.meta.updatedAt) > new Date(local.meta.updatedAt)) ? remote.meta : local.meta;

  function mergeById(a, b){
    const map = {};
    [...(a||[]), ...(b||[])].forEach(rec=>{
      const existing = map[rec.id];
      if(!existing || new Date(rec.updatedAt || rec.createdAt || 0) >= new Date(existing.updatedAt || existing.createdAt || 0)){
        map[rec.id] = rec;
      }
    });
    return Object.values(map);
  }
  merged.users = mergeById(local.users, remote.users);
  merged.products = mergeById(local.products, remote.products);
  merged.coupons = mergeById(local.coupons, remote.coupons);

  function unionById(a,b){
    const map = {};
    [...a, ...b].forEach(r=>{ map[r.id] = r; });
    return Object.values(map).sort((x,y)=> new Date(x.timestamp||x.closedAt) - new Date(y.timestamp||y.closedAt));
  }
  merged.sales = unionById(local.sales, remote.sales);
  merged.dayCloses = unionById(local.dayCloses, remote.dayCloses);
  return merged;
}

async function pullFromDrive(silent){
  try{
    const remote = await driveReadFile(state.dbFileId);
    state.db = mergeDb(state.db, remote);
    applyTheme();
    if(!silent) render();
    else renderIfLive();
  }catch(e){ console.warn("pull failed", e); }
}

let pendingSave = null;
async function pushToDrive(){
  state.db.meta.updatedAt = nowIso();
  clearTimeout(pendingSave);
  pendingSave = setTimeout(async ()=>{
    try{
      state.saving = true;
      await driveWriteFile(state.dbFileId, state.db);
    }catch(e){
      console.warn("save failed", e);
      toast("Sync failed — will retry", "err");
    }finally{
      state.saving = false;
    }
  }, 400);
}

function startSyncLoop(){
  clearInterval(state.syncTimer);
  state.syncTimer = setInterval(()=>pullFromDrive(true), CONFIG.SYNC_INTERVAL_MS);
}

/* re-render only if we're on a "live" screen, to avoid clobbering form input focus */
function renderIfLive(){
  if(["admin","developer"].includes(state.view)) render();
}

/* ================= AUTH (in-app roles) ================= */

async function seedDefaultDeveloper(){
  const hash = await sha256("developer123");
  state.db.users.push({
    id: uid(), username:"developer", passwordHash: hash, role:"developer",
    name:"Developer", active:true, createdAt: nowIso(), updatedAt: nowIso()
  });
}

async function tryLogin(username, password){
  const hash = await sha256(password);
  const user = state.db.users.find(u => u.username.toLowerCase() === username.trim().toLowerCase() && u.active !== false);
  if(!user || user.passwordHash !== hash) return null;
  return user;
}

/* ================= INIT / BOOTSTRAP ================= */

async function init(){
  if(CONFIG.CLIENT_ID.includes("YOUR_GOOGLE_OAUTH_CLIENT_ID")){
    state.view = "setup";
    render();
    return;
  }
  state.view = "connect";
  render();
}

async function handleConnect(){
  try{
    await connectDrive();
    toast("Connected to Google Drive", "ok");
    let file = await driveFindDbFile();
    if(!file){
      const fresh = defaultDb();
      await seedDefaultDbUsers(fresh);
      const id = await driveCreateDbFile(fresh);
      state.dbFileId = id;
      state.db = fresh;
      toast("Created new database on Drive", "ok");
    } else {
      state.dbFileId = file.id;
      state.db = await driveReadFile(file.id);
      if(!state.db.users || state.db.users.length===0){
        await seedDefaultDbUsers(state.db);
        await pushToDrive();
      }
    }
    if(!state.db.coupons) state.db.coupons = [];
    if(!state.db.meta.theme) state.db.meta.theme = {...DEFAULT_THEME};
    applyTheme();
    startSyncLoop();
    state.view = "login";
    render();
  }catch(e){
    console.error(e);
    toast("Could not connect to Google Drive. Check console / Client ID.", "err");
  }
}

async function seedDefaultDbUsers(db){
  const hash = await sha256("developer123");
  db.users.push({
    id: uid(), username:"developer", passwordHash: hash, role:"developer",
    name:"Developer", active:true, createdAt: nowIso(), updatedAt: nowIso()
  });
}

}

/* ================= CASHIER VIEW ================= */
function renderCashierView(el){
  const closedToday = state.db.dayCloses.find(d => d.cashierId===state.currentUser.id && d.date===todayStr());
  if(!state.db.meta.appActive){
    el.innerHTML = `<div class="empty-state"><div class="big">⏸</div><h3>System deactivated</h3><p>Ask the developer to reactivate the system before taking sales.</p></div>`;
    return;
  }
  if(closedToday){
    el.innerHTML = `<div class="empty-state"><div class="big">✅</div><h3>Day already closed</h3><p>You closed out at ${new Date(closedToday.closedAt).toLocaleTimeString()} — total ${money(closedToday.totalSales)} across ${closedToday.transactionCount} sales.</p></div>`;
    return;
  }
  const products = sortedProducts().filter(p=>p.active!==false);
  const cats = [...new Set(products.map(p=>p.category||"Other"))];

  const wrap = document.createElement("div");
  wrap.className = "pos-layout";

  const gridCol = document.createElement("div");
  cats.forEach(cat=>{
    const section = document.createElement("div");
    section.style.marginBottom = "18px";
    section.innerHTML = `<h3 style="font-size:14px; margin-bottom:10px; color:var(--crema-dim);">${cat}</h3>`;
    const grid = document.createElement("div");
    grid.className = "product-grid";
    products.filter(p=>(p.category||"Other")===cat).forEach(p=>{
      const b = document.createElement("div");
      b.className = "product-btn";
      b.style.borderColor = p.color ? p.color+"55" : "";
      b.innerHTML = `<div class="emoji">${p.emoji||"🧾"}</div><div class="pname">${p.name}</div><div class="pprice">${money(p.price)}</div>`;
      b.onclick = ()=> addToCart(p);
      grid.appendChild(b);
    });
    section.appendChild(grid);
    gridCol.appendChild(section);
  });
  if(products.length===0){
    gridCol.innerHTML = `<div class="empty-state"><div class="big">🧾</div><p>No products yet. Ask the developer to add menu buttons.</p></div>`;
  }

  const cartCol = document.createElement("div");
  cartCol.className = "cart-panel";
  const subtotal = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const discountAmt = state.appliedCoupon ? subtotal * (state.appliedCoupon.percent/100) : 0;
  const total = Math.max(0, subtotal - discountAmt);
  cartCol.innerHTML = `
    <div class="cart-head"><h3>Current order</h3></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      ${state.appliedCoupon ? `
        <div class="applied-coupon"><span>🏷️ ${state.appliedCoupon.code} — ${state.appliedCoupon.percent}% off</span><a id="removeCoupon">Remove</a></div>
      ` : `
        <div class="coupon-row">
          <input id="couponInput" placeholder="Coupon code" />
          <button class="btn btn-outline" id="applyCouponBtn">Apply</button>
        </div>
      `}
      ${discountAmt>0 ? `<div class="discount-row"><span>Discount</span><span>−${money(discountAmt)}</span></div>` : ""}
      <div class="total-row"><span style="color:var(--crema-dim); font-size:13px;">Total</span><span class="amt">${money(total)}</span></div>
      <div class="pay-toggle">
        <button data-pay="cash" class="${state.payMethod==='cash'?'active':''}">Cash</button>
        <button data-pay="card" class="${state.payMethod==='card'?'active':''}">Card</button>
      </div>
      <button class="btn btn-primary btn-block" id="checkoutBtn" ${state.cart.length===0?"disabled":""}>Complete sale — ${money(total)}</button>
      <button class="btn btn-outline btn-block" style="margin-top:8px;" id="closeDayBtn">Close day &amp; get report</button>
    </div>`;
  wrap.appendChild(gridCol);
  wrap.appendChild(cartCol);
  el.appendChild(wrap);

  const itemsEl = $("#cartItems");
  if(state.cart.length===0){
    itemsEl.innerHTML = `<div class="empty-cart">Tap a product to add it to the order.</div>`;
  } else {
    state.cart.forEach((item, idx)=>{
      const row = document.createElement("div");
      row.className = "cart-row";
      row.innerHTML = `
        <div><div class="ci-name">${item.name}</div><div class="ci-meta">${money(item.price)} each</div></div>
        <div class="qty-ctrl">
          <button data-act="dec" data-idx="${idx}">−</button>
          <span class="mono">${item.qty}</span>
          <button data-act="inc" data-idx="${idx}">+</button>
        </div>`;
      itemsEl.appendChild(row);
    });
    itemsEl.querySelectorAll("button[data-act]").forEach(b=>{
      b.onclick = ()=>{
        const idx = +b.dataset.idx;
        if(b.dataset.act==="inc") state.cart[idx].qty++;
        else{
          state.cart[idx].qty--;
          if(state.cart[idx].qty<=0) state.cart.splice(idx,1);
        }
        render();
      };
    });
  }
  wrap.querySelectorAll("[data-pay]").forEach(b=>{
    b.onclick = ()=>{ state.payMethod = b.dataset.pay; render(); };
  });
  $("#checkoutBtn").onclick = completeSale;
  $("#closeDayBtn").onclick = openCloseDayModal;
  if($("#applyCouponBtn")){
    $("#applyCouponBtn").onclick = ()=>{
      const code = $("#couponInput").value.trim();
      if(!code) return;
      const match = (state.db.coupons||[]).find(c => c.code.toLowerCase()===code.toLowerCase() && c.active!==false);
      if(!match){ toast("Coupon not found or inactive", "err"); return; }
      state.appliedCoupon = { code: match.code, percent: match.percent };
      render();
    };
    $("#couponInput").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#applyCouponBtn").click(); });
  }
  if($("#removeCoupon")){
    $("#removeCoupon").onclick = ()=>{ state.appliedCoupon = null; render(); };
  }
}

function addToCart(product){
  const existing = state.cart.find(i=>i.productId===product.id);
  if(existing) existing.qty++;
  else state.cart.push({ productId: product.id, name: product.name, price: product.price, qty: 1 });
  render();
}

async function completeSale(){
  if(state.cart.length===0) return;
  const subtotal = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const discountPercent = state.appliedCoupon ? state.appliedCoupon.percent : 0;
  const discountAmt = subtotal * (discountPercent/100);
  const total = Math.max(0, subtotal - discountAmt);
  const sale = {
    id: uid(),
    cashierId: state.currentUser.id,
    cashierName: state.currentUser.name || state.currentUser.username,
    items: state.cart.map(i=>({productId:i.productId, name:i.name, price:i.price, qty:i.qty})),
    subtotal,
    couponCode: state.appliedCoupon ? state.appliedCoupon.code : null,
    discountPercent,
    discountAmt,
    total,
    payment: state.payMethod,
    timestamp: nowIso(),
    date: todayStr()
  };
  state.db.sales.push(sale);
  state.cart = [];
  state.appliedCoupon = null;
  await pushToDrive();
  showReceiptModal(sale);
  render();
}

    <hr/>
    <div class="rline" style="font-weight:700;"><span>TOTAL</span><span>${money(total)}</span></div>`;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>Close out the day</h3>
      <div class="receipt">${reportHtml}</div>
      <p style="font-size:12px; color:var(--crema-dim); margin-top:12px;">Once closed, no more sales can be entered under your name today. This report syncs to the developer and admin.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="printCloseBtn">🖨️ Print</button>
        <button class="btn btn-outline btn-block" id="cancelClose">Cancel</button>
        <button class="btn btn-primary btn-block" id="confirmClose">Confirm close</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("#printCloseBtn").onclick = ()=> printHTML(`<div class="receipt">${reportHtml}</div>`);
  $("#cancelClose").onclick = ()=>bg.remove();
  $("#confirmClose").onclick = async ()=>{
    const report = {
      id: uid(),
      cashierId: state.currentUser.id,
      cashierName: state.currentUser.name || state.currentUser.username,
      date: todayStr(),
      totalSales: total,
      transactionCount: todaySales.length,
      breakdown: { cash, card, byProduct },
      closedAt: nowIso()
    };
    state.db.dayCloses.push(report);
    await pushToDrive();
    bg.remove();

              <td style="text-align:right;">${money(c.totalSales)}</td>
              <td><a class="link" data-print="${c.id}">Print</a></td>
            </tr>`).join("") || `<tr><td colspan="7" style="text-align:center; color:var(--crema-dim); padding:24px;">No day-close reports yet.</td></tr>`}
        </tbody>
      </table>
    </div>`;
  el.querySelectorAll("[data-print]").forEach(a=>{
    a.onclick = ()=>{
      const c = closes.find(x=>x.id===a.dataset.print);
      const html = `
        <div class="rline"><span>Cashier</span><span>${c.cashierName}</span></div>
        <div class="rline"><span>Date</span><span>${c.date}</span></div>
        <hr/>
        <div class="rline"><span>Transactions</span><span>${c.transactionCount}</span></div>
        <div class="rline"><span>Cash</span><span>${money(c.breakdown.cash)}</span></div>
        <div class="rline"><span>Card</span><span>${money(c.breakdown.card)}</span></div>
        <hr/>
        ${Object.entries(c.breakdown.byProduct||{}).map(([n,q])=>`<div class="rline"><span>${n}</span><span>x${q}</span></div>`).join("")}
        <hr/>
        <div class="rline" style="font-weight:700;"><span>TOTAL</span><span>${money(c.totalSales)}</span></div>`;
      printHTML(`<div class="receipt">${html}</div>`);
    };
  });
}

function sortedProducts(){
  return state.db.products.slice().sort((a,b)=> (a.order??0) - (b.order??0));
}

function renderMenuList(el, editable){
  el.innerHTML = `<div class="card"><h3 style="margin-bottom:6px; font-size:15px;">Menu (${editable?"editable":"view only"})</h3>
    ${editable ? `<div class="drag-hint">Drag a button to reorder it — the new order shows up for cashiers right away.</div>` : ""}
    <div id="menuGrid" class="product-grid"></div></div>`;
  const grid = $("#menuGrid");
  const products = sortedProducts();
  products.forEach(p=>{
    const c = document.createElement("div");
    c.className = "product-btn" + (editable ? " draggable" : "");
    c.style.cursor = editable ? "grab" : "default";
    c.style.opacity = p.active===false ? "0.4" : "1";
    c.dataset.pid = p.id;
    c.innerHTML = `<div class="emoji">${p.emoji||"🧾"}</div><div class="pname">${p.name}</div><div class="pprice">${money(p.price)}</div>`;
    if(editable){
      c.onclick = ()=>openProductModal(p);
      c.draggable = true;
      c.addEventListener("dragstart", e=>{
        state.dragProductId = p.id;
        c.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      c.addEventListener("dragend", ()=> c.classList.remove("dragging"));
      c.addEventListener("dragover", e=>{ e.preventDefault(); c.classList.add("drag-over"); });
      c.addEventListener("dragleave", ()=> c.classList.remove("drag-over"));
      c.addEventListener("drop", async e=>{
        e.preventDefault();
        c.classList.remove("drag-over");
        const draggedId = state.dragProductId;
        if(!draggedId || draggedId===p.id) return;
        const ordered = sortedProducts();
        const fromIdx = ordered.findIndex(x=>x.id===draggedId);
        const toIdx = ordered.findIndex(x=>x.id===p.id);
        if(fromIdx<0 || toIdx<0) return;
        const [moved] = ordered.splice(fromIdx,1);
        ordered.splice(toIdx,0,moved);
        ordered.forEach((prod,i)=>{
          prod.order = i;
          prod.updatedAt = nowIso();
        });
        await pushToDrive();
        render();
      });
    }
    grid.appendChild(c);
  });
  if(editable){
    const addBtn = document.createElement("div");
    addBtn.className = "product-btn";
    addBtn.style.cursor = "pointer";
    addBtn.innerHTML = `<div class="emoji">➕</div><div class="pname">Add button</div>`;
    addBtn.onclick = ()=>openProductModal(null);
    grid.appendChild(addBtn);
  }
}

function renderTeamList(el, editable){
  el.innerHTML = `<div class="card"><h3 style="margin-bottom:12px; font-size:15px;">Team (${editable?"editable":"view only"})</h3>
    <table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th>${editable?"<th></th>":""}</tr></thead>
    <tbody id="teamBody"></tbody></table>
    ${editable?'<button class="btn btn-primary" id="addUserBtn" style="margin-top:14px;">Add cashier / admin</button>':""}
    </div>`;
  const body = $("#teamBody");
  state.db.users.forEach(u=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${u.name}</td><td class="mono">${u.username}</td><td style="text-transform:capitalize;">${u.role}</td>
      <td style="color:${u.active===false?'var(--err)':'var(--ok)'};">${u.active===false?"Disabled":"Active"}</td>
      ${editable?`<td><a class="link" data-uid="${u.id}">Edit</a></td>`:""}`;
    body.appendChild(tr);
  });
  if(editable){
    $("#addUserBtn").onclick = ()=>openUserModal(null);
    body.querySelectorAll("a[data-uid]").forEach(a=>{
      a.onclick = ()=>openUserModal(state.db.users.find(u=>u.id===a.dataset.uid));
    });
  }
}

/* ================= DEVELOPER VIEW ================= */
function renderDeveloperView(el){
  const toggleWrap = document.createElement("div");
  toggleWrap.className = "banner " + (state.db.meta.appActive ? "" : "err");
  toggleWrap.style.display = "flex";
  toggleWrap.style.justifyContent = "space-between";
  toggleWrap.style.alignItems = "center";
  toggleWrap.style.border = "1px solid var(--line)";
  toggleWrap.style.background = "var(--espresso-2)";
  toggleWrap.innerHTML = `
    <div>
      <b>Main system ${state.db.meta.appActive ? "is active" : "is deactivated"}</b>
      <div style="font-size:12px; color:var(--crema-dim); margin-top:2px;">Clones on cashier devices sync from Drive and follow this switch.</div>
    </div>
    <button class="btn ${state.db.meta.appActive ? 'btn-danger':'btn-primary'}" id="toggleActive">${state.db.meta.appActive ? "Deactivate" : "Activate"}</button>
  `;
  el.appendChild(toggleWrap);
  el.appendChild(document.createElement("div")).style.height="14px";

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  [["products","Menu buttons"],["coupons","Coupons"],["theme","Theme"],["team","Cashiers & admins"],["live","Live sales"],["reports","Day reports"]].forEach(([key,label])=>{
    const t = document.createElement("div");
    t.className = "tab" + (state.devTab===key ? " active":"");
    t.textContent = label;
    t.onclick = ()=>{ state.devTab = key; render(); };
    tabs.appendChild(t);
  });
  el.appendChild(tabs);

  const body = document.createElement("div");
  el.appendChild(body);

  $("#toggleActive").onclick = async ()=>{
    state.db.meta.appActive = !state.db.meta.appActive;
    await pushToDrive();
    render();
  };

  if(state.devTab==="products") return renderMenuList(body, true);
  if(state.devTab==="coupons") return renderCouponsList(body, true);
  if(state.devTab==="theme") return renderThemeEditor(body);
  if(state.devTab==="team") return renderTeamList(body, true);
  if(state.devTab==="live") return renderLiveSales(body, true);
  if(state.devTab==="reports") return renderReportsList(body, true);
}

/* ================= COUPONS ================= */
function renderCouponsList(el, editable){
  const coupons = (state.db.coupons||[]).slice().sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0));
  el.innerHTML = `<div class="card"><h3 style="margin-bottom:12px; font-size:15px;">Coupons (${editable?"editable":"view only"})</h3>
    <table><thead><tr><th>Code</th><th>Discount</th><th>Status</th>${editable?"<th></th>":""}</tr></thead>
    <tbody id="couponBody"></tbody></table>
    ${editable?'<button class="btn btn-primary" id="addCouponBtn" style="margin-top:14px;">Add coupon</button>':""}
    </div>`;
  const body = $("#couponBody");
  if(coupons.length===0){
    body.innerHTML = `<tr><td colspan="${editable?4:3}" style="text-align:center; color:var(--crema-dim); padding:24px;">No coupons yet.</td></tr>`;
  }
  coupons.forEach(c=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="mono">${c.code}</td><td>${c.percent}% off</td>
      <td style="color:${c.active===false?'var(--err)':'var(--ok)'};">${c.active===false?"Disabled":"Active"}</td>
      ${editable?`<td><a class="link" data-cid="${c.id}">Edit</a></td>`:""}`;
    body.appendChild(tr);
  });
  if(editable){
    $("#addCouponBtn").onclick = ()=>openCouponModal(null);
    body.querySelectorAll("a[data-cid]").forEach(a=>{
      a.onclick = ()=>openCouponModal(coupons.find(c=>c.id===a.dataset.cid));
    });
  }
}

function openCouponModal(coupon){
  const isNew = !coupon;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "New coupon" : "Edit coupon"}</h3>
      <div class="field"><label>Code (what the cashier types)</label><input id="cfCode" value="${coupon?coupon.code:""}" style="text-transform:uppercase;" /></div>
      <div class="field"><label>Discount percent (%)</label><input id="cfPercent" type="number" min="1" max="100" value="${coupon?coupon.percent:10}" /></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="cfActive" style="width:auto;" ${coupon.active!==false?"checked":""}/> Coupon active</label></div>` : ""}
      <div class="modal-actions">
        ${!isNew ? '<button class="btn btn-danger" id="delCoupon">Delete</button>' : '<span></span>'}
        <button class="btn btn-outline" id="cancelCoupon">Cancel</button>
        <button class="btn btn-primary" id="saveCoupon">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("#cancelCoupon").onclick = ()=>bg.remove();
  $("#saveCoupon").onclick = async ()=>{
    const code = $("#cfCode").value.trim().toUpperCase();
    const percent = parseFloat($("#cfPercent").value);
    if(!code || isNaN(percent) || percent<=0 || percent>100){ toast("Enter a code and a percent between 1-100","err"); return; }
    if(!state.db.coupons) state.db.coupons = [];
    if(isNew){
      if(state.db.coupons.some(c=>c.code.toUpperCase()===code)){ toast("That code already exists","err"); return; }
      state.db.coupons.push({ id: uid(), code, percent, active:true, createdAt: nowIso(), updatedAt: nowIso() });
    } else {
      coupon.code = code; coupon.percent = percent;
      coupon.active = $("#cfActive").checked;
      coupon.updatedAt = nowIso();
    }
    await pushToDrive();
    bg.remove();
    render();
  };
  if(!isNew){
    $("#delCoupon").onclick = async ()=>{
      state.db.coupons = state.db.coupons.filter(c=>c.id!==coupon.id);
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

/* ================= THEME EDITOR (developer only) ================= */
function renderThemeEditor(el){
  const t = state.db.meta.theme || {...DEFAULT_THEME};
  const fields = [
    ["bg","Background", t.bg||DEFAULT_THEME.bg],
    ["bg2","Panels / cards", t.bg2||DEFAULT_THEME.bg2],
    ["accent","Accent (buttons)", t.accent||DEFAULT_THEME.accent],
    ["accentLight","Accent — hover", t.accentLight||DEFAULT_THEME.accentLight],
    ["text","Text color", t.text||DEFAULT_THEME.text],
  ];
  el.innerHTML = `<div class="card">
    <h3 style="margin-bottom:6px; font-size:15px;">App colors</h3>
    <p style="font-size:12.5px; color:var(--crema-dim); margin-bottom:16px;">Changes apply to every device (cashier, admin, developer) once saved.</p>
    <div class="theme-grid" id="themeGrid"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline" id="resetThemeBtn">Reset to default</button>
      <button class="btn btn-primary" id="saveThemeBtn">Save colors</button>
    </div>
  </div>`;
  const grid = $("#themeGrid");
  const draft = {...t};
  fields.forEach(([key,label,val])=>{
    const row = document.createElement("div");
    row.className = "theme-swatch-field";
    row.innerHTML = `<input type="color" id="tf_${key}" value="${val}" />
      <div style="flex:1;"><div class="tlabel">${label}</div><div class="tval" id="tv_${key}">${val}</div></div>`;
    grid.appendChild(row);
    row.querySelector("input").addEventListener("input", e=>{
      draft[key] = e.target.value;
      $("#tv_"+key).textContent = e.target.value;
      applyThemeDraft(draft); // live preview
    });
  });
  $("#saveThemeBtn").onclick = async ()=>{
    state.db.meta.theme = draft;
    applyTheme();
    await pushToDrive();
    toast("Theme saved", "ok");
  };
  $("#resetThemeBtn").onclick = async ()=>{
    state.db.meta.theme = {...DEFAULT_THEME};
    applyTheme();
    await pushToDrive();
    toast("Theme reset to default", "ok");
    render();
  };
}

function applyThemeDraft(draft){
  const root = document.documentElement.style;
  root.setProperty("--espresso", draft.bg);
  root.setProperty("--espresso-2", draft.bg2);
  root.setProperty("--copper", draft.accent);
  root.setProperty("--copper-light", draft.accentLight);
  root.setProperty("--paper", draft.text);
}

/* ---- product editor modal (developer only) ---- */
function openProductModal(product){
  const isNew = !product;
  const colors = ["#b5652f","#d98a52","#c7a877","#8a5a34","#3d3128","#7a9a6c","#b5453a","#4d6a8f"];
  let selColor = product ? product.color : colors[0];
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "New menu button" : "Edit menu button"}</h3>
      <div class="field"><label>Name</label><input id="pfName" value="${product?product.name:""}" /></div>
      <div class="field"><label>Price (USD)</label><input id="pfPrice" type="number" step="0.01" value="${product?product.price:""}" /></div>
      <div class="field"><label>Category</label><input id="pfCat" value="${product?product.category:"Coffee"}" /></div>
      <div class="field"><label>Emoji</label><input id="pfEmoji" value="${product?product.emoji:"☕"}" maxlength="4" /></div>
      <div class="field"><label>Color</label><div class="swatch-row" id="swatchRow"></div></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="pfActive" style="width:auto;" ${product.active!==false?"checked":""}/> Button visible to cashiers</label></div>` : ""}
      <div class="modal-actions">
        ${!isNew ? '<button class="btn btn-danger" id="delProd">Delete</button>' : '<span></span>'}
        <button class="btn btn-outline" id="cancelProd">Cancel</button>
        <button class="btn btn-primary" id="saveProd">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const row = $("#swatchRow");
  colors.forEach(c=>{
    const s = document.createElement("div");
    s.className = "swatch" + (c===selColor ? " sel":"");
    s.style.background = c;
    s.onclick = ()=>{ selColor = c; row.querySelectorAll(".swatch").forEach(x=>x.classList.remove("sel")); s.classList.add("sel"); };
    row.appendChild(s);
  });
  $("#cancelProd").onclick = ()=>bg.remove();
  $("#saveProd").onclick = async ()=>{
    const name = $("#pfName").value.trim();
    const price = parseFloat($("#pfPrice").value);
    if(!name || isNaN(price)){ toast("Name and price are required","err"); return; }
    if(isNew){
      const maxOrder = state.db.products.reduce((m,p)=>Math.max(m, p.order??0), -1);
      state.db.products.push({
        id: uid(), name, price, category: $("#pfCat").value.trim()||"Other",
        emoji: $("#pfEmoji").value.trim()||"🧾", color: selColor, active:true, order: maxOrder+1, updatedAt: nowIso()
      });
    } else {
      Object.assign(product, {
        name, price, category: $("#pfCat").value.trim()||"Other",
        emoji: $("#pfEmoji").value.trim()||"🧾", color: selColor,
        active: $("#pfActive").checked, updatedAt: nowIso()
      });
    }
    await pushToDrive();
    bg.remove();
    render();
  };
  if(!isNew){
    $("#delProd").onclick = async ()=>{
      state.db.products = state.db.products.filter(p=>p.id!==product.id);
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

/* ---- user editor modal (developer only) ---- */
function openUserModal(user){
  const isNew = !user;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${isNew ? "Add team member" : "Edit team member"}</h3>
      <div class="field"><label>Full name</label><input id="ufName" value="${user?user.name:""}" /></div>
      <div class="field"><label>Username</label><input id="ufUser" value="${user?user.username:""}" ${user?"disabled":""} /></div>
      <div class="field"><label>Role</label>
        <select id="ufRole">
          <option value="cashier" ${user&&user.role==='cashier'?'selected':''}>Cashier</option>
          <option value="admin" ${user&&user.role==='admin'?'selected':''}>Admin</option>
        </select>
      </div>
      <div class="field"><label>${isNew?"Password":"New password (leave blank to keep current)"}</label><input id="ufPass" type="password" /></div>
      ${!isNew ? `<div class="field"><label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="ufActive" style="width:auto;" ${user.active!==false?"checked":""}/> Account active</label></div>` : ""}
      <div class="modal-actions">
        ${!isNew ? '<button class="btn btn-danger" id="delUser">Remove</button>' : '<span></span>'}
        <button class="btn btn-outline" id="cancelUser">Cancel</button>
        <button class="btn btn-primary" id="saveUser">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  $("#cancelUser").onclick = ()=>bg.remove();
  $("#saveUser").onclick = async ()=>{
    const name = $("#ufName").value.trim();
    const username = $("#ufUser").value.trim();
    const role = $("#ufRole").value;
    const pass = $("#ufPass").value;
    if(!name || !username){ toast("Name and username are required","err"); return; }
    if(isNew){
      if(state.db.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){
        toast("Username already exists","err"); return;
      }
      if(!pass){ toast("Password is required","err"); return; }
      const hash = await sha256(pass);
      state.db.users.push({ id: uid(), username, passwordHash: hash, role, name, active:true, createdAt: nowIso(), updatedAt: nowIso() });
    } else {
      user.name = name; user.role = role; user.updatedAt = nowIso();
      user.active = $("#ufActive").checked;
      if(pass) user.passwordHash = await sha256(pass);
    }
    await pushToDrive();
    bg.remove();
    render();
  };
  if(!isNew){
    $("#delUser").onclick = async ()=>{
      state.db.users = state.db.users.filter(u=>u.id!==user.id);
      await pushToDrive();
      bg.remove();
      render();
    };
  }
}

/* ---------------- boot ---------------- */
init();
</script>
